name: SIGR CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Descargar código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install flask

    - name: Validar sintaxis Python
      run: |
        python -m py_compile app.py
        python -m py_compile modules/usuarios.py
        python -m py_compile modules/menu.py
        python -m py_compile modules/pedidos.py
        python -m py_compile modules/reservas.py
        python -m py_compile modules/reportes.py

    - name: Simulación despliegue
      run: |
        echo "Despliegue exitoso en entorno de pruebas"